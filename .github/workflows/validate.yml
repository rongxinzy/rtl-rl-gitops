name: Validate GitOps
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate static manifests
        run: python3 scripts/validate.py
      - name: Test nonblocking catalog snapshots
        working-directory: src
        run: python3 -B -m unittest research.executor.test_catalog_cache
      - name: Test scalar relay recovery and validation
        run: python3 -B -m unittest discover -s src/infrastructure/swanlab -p 'test_*.py'
      - name: Test LLaMA-Factory checkpoint bridge
        run: python3 -B -m unittest discover -s src/training/llamafactory -p 'test_*.py'
      - name: Test trusted training profiles and legacy admission
        working-directory: src
        run: python3 -B -m unittest research.l20_worker.test_worker research.l20_worker.test_phase_control research.l20_worker.test_profiles research.executor.test_l20_branch research.executor.test_executor
      - name: Test pro nighttime LLaMA-Factory runner
        run: python3 -B -m unittest discover -s src/scheduling -p 'test_*.py'
      - name: Test pro admission and evaluation runtime
        working-directory: src
        run: |
          python3 -B -m unittest research.executor.test_lf_profile
          python3 -B -m unittest discover -s research/evaluation -p 'test_runtime.py'
      - name: Scan explicit public files and all reachable history
        run: python3 scripts/scan_public.py --root . --allowlist public-files.json --history
